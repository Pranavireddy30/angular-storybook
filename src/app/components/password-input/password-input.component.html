<div class="app-password-input">
  <div class="input-wrap">
    <input class="password-field" [type]="show ? 'text' : 'password'" [placeholder]="placeholder" [value]="value" (input)="onInput($event)" />
    <button type="button" class="toggle" (click)="toggle()" [attr.aria-pressed]="show" [attr.aria-label]="show ? 'Hide password' : 'Show password'">
      <svg *ngIf="!show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <svg *ngIf="show" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.28"></path><path d="M1 1l22 22"></path><path d="M9.53 9.53A3.5 3.5 0 0 0 14.47 14.47"></path></svg>
    </button>
  </div>
</div>
