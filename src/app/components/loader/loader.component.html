<div class="app-loader" [style.width.px]="size" [style.height.px]="size" aria-label="Loading">
  <svg class="loader-svg" viewBox="0 0 50 50">
    <circle class="loader-track" cx="25" cy="25" r="18" fill="none" stroke="rgba(85, 90, 185, 0.18)" stroke-width="4"></circle>
    <circle class="loader-ring" cx="25" cy="25" r="18" fill="none" stroke="#555ab9" stroke-width="4" stroke-linecap="round"></circle>
  </svg>
</div>
