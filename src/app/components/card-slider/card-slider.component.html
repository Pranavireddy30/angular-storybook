<div class="app-card-slider">
  <button 
    class="app-card-slider__button app-card-slider__button--prev" 
    (click)="prev()" 
    [disabled]="isPrevDisabled"
    aria-label="Previous">
    <span>‹</span>
  </button>
  <div class="app-card-slider__viewport" #viewport>
    <ng-content></ng-content>
  </div>
  <button 
    class="app-card-slider__button app-card-slider__button--next" 
    (click)="next()" 
    [disabled]="isNextDisabled"
    aria-label="Next">
    <span>›</span>
  </button>
</div>
