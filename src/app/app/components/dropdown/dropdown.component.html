<select
  [ngClass]="classes"
  [ngStyle]="{ 'background-color': backgroundColor }"
  (change)="onSelect.emit($event.target.value)"
>
  <option value="">{{ placeholder }}</option>
  <option *ngFor="let opt of options" [value]="opt.value" [selected]="opt.value === selected">
    {{ opt.label }}
  </option>
</select>
